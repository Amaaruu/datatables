datatables:
  version: 2.x
  js:
    js/datatables.js: {}
  dependencies:
    - core/jquery
    - core/once
    - core/drupalSettings

datatables_core:
  version: 1.10
  js:
    /libraries/datatables/media/js/jquery.dataTables.js: {}
  css:
    component:
      /libraries/datatables/media/css/jquery.dataTables.css: {}
  dependencies:
    - core/jquery

# Nueva librería moderna de botones HTML5 (Reemplaza a TableTools)
datatables_buttons:
  version: 2.x
  js:
    https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js: { type: external, minified: true }
    https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js: { type: external, minified: true }
    https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js: { type: external, minified: true }
    https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js: { type: external, minified: true }
  css:
    theme:
      https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css: { type: external, minified: true }
  dependencies:
    - datatables/datatables_core